    <style>
        /* พื้นหลังสีชมพูพาสเทลและไอคอนขนมขยับได้ */
        body {
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
            background: linear-gradient(135deg, #fff0f5 0%, #f8f0ff 50%, #fff8f0 100%);
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -999;
            background: 
                radial-gradient(circle at 10% 20%, rgba(255, 182, 193, 0.3) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 182, 193, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 30% 60%, rgba(255, 192, 203, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 70% 30%, rgba(255, 218, 185, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 240, 245, 0.4) 0%, transparent 60%);
            animation: gentleMove 25s ease-in-out infinite alternate;
            background-size: 300% 300%;
            opacity: 0.8;
        }
        
        /* สร้างไอคอนขนมลอยได้ */
        .sweet-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -998;
            pointer-events: none;
            overflow: hidden;
        }
        
        .sweet-icon {
            position: absolute;
            font-family: "Font Awesome 5 Free";
            font-weight: 900;
            color: rgba(255, 182, 193, 0.4);
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.3);
            z-index: -997;
            user-select: none;
        }
        
        .sweet-icon::before {
            content: attr(data-icon);
        }
        
        .sweet-icon.macaroon {
            color: rgba(221, 160, 221, 0.5);
            text-shadow: 0 0 15px rgba(186, 85, 211, 0.4);
        }
        
        .sweet-icon.cookie {
            color: rgba(255, 228, 181, 0.5);
            text-shadow: 0 0 15px rgba(210, 180, 140, 0.4);
        }
        
        .sweet-icon.cake {
            color: rgba(255, 192, 203, 0.5);
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.4);
        }
        
        .sweet-icon.icecream {
            color: rgba(173, 216, 230, 0.5);
            text-shadow: 0 0 15px rgba(135, 206, 250, 0.4);
        }
        
        /* Keyframes สำหรับการเคลื่อนไหว */
        @keyframes gentleMove {
            0% {
                background-position: 0% 0%;
                transform: scale(1);
            }
            25% {
                background-position: 100% 25%;
            }
            50% {
                background-position: 50% 100%;
                transform: scale(1.02);
            }
            75% {
                background-position: 0% 75%;
            }
            100% {
                background-position: 100% 0%;
                transform: scale(1);
            }
        }
        
        @keyframes floatSweet {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg) scale(1);
            }
            25% {
                transform: translate(15px, -20px) rotate(10deg) scale(1.1);
            }
            50% {
                transform: translate(-10px, -30px) rotate(-5deg) scale(0.9);
            }
            75% {
                transform: translate(20px, -10px) rotate(15deg) scale(1.05);
            }
        }
        
        @keyframes pulseSweet {
            0%, 100% {
                opacity: 0.4;
                transform: scale(1);
            }
            50% {
                opacity: 0.7;
                transform: scale(1.2);
            }
        }
        
        @keyframes rotateSweet {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        
        @keyframes bounceSweet {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
    </style>

    <script>
        // เพิ่มไอคอนขนมลอยได้ในพื้นหลัง
        document.addEventListener('DOMContentLoaded', function() {
            // สร้าง container สำหรับไอคอนขนม
            const sweetContainer = document.createElement('div');
            sweetContainer.className = 'sweet-background';
            document.body.appendChild(sweetContainer);
            
            // ไอคอนขนมต่างๆ (Font Awesome icons)
            const sweetIcons = [
                { icon: '🍪', class: 'cookie', name: 'cookie' },
                { icon: '🍩', class: 'macaroon', name: 'donut' },
                { icon: '🍰', class: 'cake', name: 'cake' },
                { icon: '🍫', class: 'cookie', name: 'chocolate' },
                { icon: '🍦', class: 'icecream', name: 'icecream' },
                { icon: '🥨', class: 'cookie', name: 'pretzel' },
                { icon: '🥞', class: 'cake', name: 'pancakes' }
            ];
            
            // สร้างไอคอนขนมลอยได้
            for (let i = 0; i < 30; i++) {
                const sweetIcon = document.createElement('div');
                sweetIcon.className = 'sweet-icon';
                
                // เลือกไอคอนแบบสุ่ม
                const randomIcon = sweetIcons[Math.floor(Math.random() * sweetIcons.length)];
                sweetIcon.setAttribute('data-icon', randomIcon.icon);
                sweetIcon.classList.add(randomIcon.class);
                
                // ขนาดสุ่ม
                const size = Math.random() * 40 + 20;
                sweetIcon.style.fontSize = `${size}px`;
                
                // ตำแหน่งสุ่ม
                sweetIcon.style.left = `${Math.random() * 100}%`;
                sweetIcon.style.top = `${Math.random() * 100}%`;
                
                // การเคลื่อนไหวแบบต่างๆ
                const animationTypes = ['floatSweet', 'pulseSweet', 'rotateSweet', 'bounceSweet'];
                const randomAnim = animationTypes[Math.floor(Math.random() * animationTypes.length)];
                
                const duration = 15 + Math.random() * 15;
                const delay = Math.random() * 10;
                
                // เลือก animation type
                let animationName;
                let animationTiming;
                
                if (randomAnim === 'rotateSweet') {
                    animationName = 'rotateSweet';
                    animationTiming = 'linear';
                } else if (randomAnim === 'pulseSweet') {
                    animationName = 'pulseSweet';
                    animationTiming = 'ease-in-out';
                } else if (randomAnim === 'bounceSweet') {
                    animationName = 'bounceSweet';
                    animationTiming = 'ease-in-out';
                } else {
                    animationName = 'floatSweet';
                    animationTiming = 'ease-in-out';
                }
                
                sweetIcon.style.animation = `${animationName} ${duration}s ${animationTiming} ${delay}s infinite`;
                
                // เพิ่มเอฟเฟคเงาและ opacity
                sweetIcon.style.opacity = `${0.2 + Math.random() * 0.3}`;
                
                sweetContainer.appendChild(sweetIcon);
            }
            
            // Parallax effect เมื่อเลื่อนเมาส์
            document.addEventListener('mousemove', function(e) {
                const sweets = document.querySelectorAll('.sweet-icon');
                const mouseX = e.clientX / window.innerWidth;
                const mouseY = e.clientY / window.innerHeight;
                
                sweets.forEach(sweet => {
                    const speed = parseFloat(sweet.style.fontSize) * 0.01;
                    const x = (mouseX - 0.5) * speed * 50;
                    const y = (mouseY - 0.5) * speed * 50;
                    
                    // ใช้ transform translate แทนการเปลี่ยนตำแหน่งโดยตรง
                    const currentTransform = sweet.style.transform || '';
                    const baseTransform = currentTransform.split('translate')[0];
                    sweet.style.transform = `${baseTransform} translate(${x}px, ${y}px)`;
                });
            });
            
            // เพิ่มเอฟเฟคเมื่อคลิก (สร้างไอคอนใหม่)
            document.addEventListener('click', function(e) {
                if (Math.random() > 0.7) { // 30% โอกาส
                    createSweetBurst(e.clientX, e.clientY);
                }
            });
            
            function createSweetBurst(x, y) {
                const burstCount = 5;
                const container = document.querySelector('.sweet-background');
                
                for (let i = 0; i < burstCount; i++) {
                    const burstSweet = document.createElement('div');
                    burstSweet.className = 'sweet-icon macaroon';
                    burstSweet.setAttribute('data-icon', '🍬');
                    burstSweet.style.fontSize = '25px';
                    burstSweet.style.left = `${x}px`;
                    burstSweet.style.top = `${y}px`;
                    burstSweet.style.position = 'absolute';
                    burstSweet.style.opacity = '0.6';
                    burstSweet.style.animation = `floatSweet 3s ease-out forwards`;
                    
                    container.appendChild(burstSweet);
                    
                    // ลบหลังจาก animation เสร็จ
                    setTimeout(() => {
                        burstSweet.remove();
                    }, 3000);
                }
            }
        });
    </script>
